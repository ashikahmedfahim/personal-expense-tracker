name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA or tag to deploy (defaults to current commit)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, push, and deploy
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REPOSITORY_URL }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
          ECS_TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          IMAGE="${ECR_REGISTRY}:${IMAGE_TAG}"
          docker build -t "${IMAGE}" -t "${ECR_REGISTRY}:prod" .
          docker push "${IMAGE}"
          docker push "${ECR_REGISTRY}:prod"
          ./scripts/ecs-deploy.sh "${ECS_CLUSTER}" "${ECS_SERVICE}" "${ECS_TASK_FAMILY}" "${IMAGE}"

      - name: Health check
        run: curl -fsS "${{ secrets.API_URL }}/health"
